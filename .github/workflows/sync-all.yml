name: Ultimate Safe Sync

on:
  schedule:
    # 每天 UTC 3:15 和 15:15（北京时间 11:15 和 23:15）
    - cron: '15 3,15 * * *'
  workflow_dispatch:

permissions:
  contents: write
  # 修改 .github/workflows/ 下的文件（哪怕只是改名加 .disabled）都需要这一项
  workflows: write

# 同一时间只允许一个同步任务，避免两次改动互相打架
concurrency:
  group: ultimate-safe-sync
  cancel-in-progress: false

jobs:
  sync-all:
    runs-on: ubuntu-latest
    env:
      # ⚠️ 唯一需要你确认的地方：留空则自动识别 fork 的 parent，独立仓库必须写死
      UPSTREAM: "ybblab/Jiumi"
    steps:
      - name: Checkout backup repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Safe Sync Code, Tags and Snapshots
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SYNC_FILE=".github/workflows/sync-all.yml"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 独立仓库没有 parent，UPSTREAM 直接用手写的值
          git remote remove upstream 2>/dev/null || true
          git remote add upstream "https://github.com/$UPSTREAM.git"
          git fetch upstream --tags --prune --force

          # ==========================================
          # 🛡️ 防御机制：防跑路 / 防恶意回退熔断
          # ==========================================
          UPSTREAM_COMMITS=$(git rev-list --count upstream/main 2>/dev/null || echo 0)
          LOCAL_COMMITS=$(git rev-list --count HEAD 2>/dev/null || echo 0)
          echo "源仓库提交数: $UPSTREAM_COMMITS | 本地提交数: $LOCAL_COMMITS"

          if [ "$UPSTREAM_COMMITS" -lt 10 ] && [ "$LOCAL_COMMITS" -gt 50 ]; then
            echo "🚨 警告：源仓库代码疑似被清空或恶意回退！已自动拦截代码覆盖。"
          else
            for branch in $(git for-each-ref --format='%(refname:strip=3)' refs/remotes/upstream); do
              if [ "$branch" = "HEAD" ]; then continue; fi

              if git show-ref --verify --quiet "refs/heads/$branch"; then
                git checkout "$branch"
                # 有共同历史 -> 普通合并；冲突保留本地
                # 无共同历史（打包上传/网页新建的仓库）-> 镜像重置，并保住本工作流
                if [ -n "$(git merge-base HEAD "upstream/$branch" 2>/dev/null)" ]; then
                  git merge "upstream/$branch" --no-edit -m "Sync with upstream $branch" || { echo "冲突，保留本地"; git merge --abort; }
                else
                  echo "检测到无关历史（打包上传的仓库），按镜像方式重置 $branch"
                  cp "$SYNC_FILE" /tmp/sync-all.yml 2>/dev/null || true
                  git reset --hard "upstream/$branch"
                  mkdir -p .github/workflows
                  cp /tmp/sync-all.yml "$SYNC_FILE" 2>/dev/null || true
                fi
              else
                git checkout -b "$branch" "upstream/$branch"
              fi

              # ==========================================
              # 🚫 核心禁用机制：给原作者的 workflow 文件改后缀
              # ==========================================
              mkdir -p .github/workflows
              find .github/workflows -maxdepth 1 -type f \( -name "*.yml" -o -name "*.yaml" \) ! -name "sync-all.yml" | while IFS= read -r file; do
                echo "禁用工作流: $file -> $file.disabled"
                mv "$file" "$file.disabled"
              done || true

              git add -A .github/workflows/
              git diff --staged --quiet || git commit -m "chore: disable upstream workflows"

              # 无关历史重置后必须强推，普通合并也只是快进
              git push origin "$branch" --force || echo "推送 $branch 失败"
            done
            git push origin --tags --force || true
          fi

          DEFAULT_BRANCH=$(gh api "repos/${{ github.repository }}" --jq '.default_branch' 2>/dev/null || echo main)
          git checkout "$DEFAULT_BRANCH" || git checkout main || git checkout master || true

          # ==========================================
          # 📸 快照机制：每天一个，保留最新 5 个
          # ==========================================
          TODAY=$(date +%Y%m%d)
          SNAPSHOTS=$(git tag -l "snapshot-*" | sort -r)
          if ! echo "$SNAPSHOTS" | grep -q "snapshot-$TODAY"; then
            git tag "snapshot-$TODAY"
            git push origin "snapshot-$TODAY" || true
            SNAPSHOTS=$(git tag -l "snapshot-*" | sort -r)
            SNAPSHOT_COUNT=$(echo "$SNAPSHOTS" | grep -c "snapshot-" || true)
            if [ "$SNAPSHOT_COUNT" -gt 5 ]; then
              TO_DELETE=$(echo "$SNAPSHOTS" | tail -n +6)
              for OLD_SNAP in $TO_DELETE; do
                git push origin --delete "$OLD_SNAP" || true
                git tag -d "$OLD_SNAP" || true
              done
            fi
          fi

      - name: Sync Releases with Assets (Keep Latest 30)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -s "https://api.github.com/repos/$UPSTREAM/releases?per_page=30" > releases.json
          if ! grep -q "tag_name" releases.json; then
            echo "未找到公开的 Release。"
            exit 0
          fi

          TAGS=$(jq -r '.[].tag_name' releases.json)
          for TAG in $TAGS; do
            if gh release view "$TAG" --repo ${{ github.repository }} > /dev/null 2>&1; then
              echo "Release $TAG 已存在。"
            else
              mkdir -p ./assets
              # 完美还原标题
              NAME=$(jq -r ".[] | select(.tag_name == \"$TAG\") | .name // empty" releases.json)
              BODY=$(jq -r ".[] | select(.tag_name == \"$TAG\") | .body // empty" releases.json)
              if [ -z "$NAME" ]; then TITLE="$TAG"; else TITLE="$NAME"; fi
              echo -e "$NAME\n\n$BODY" > notes.txt

              DOWNLOAD_URLS=$(jq -r ".[] | select(.tag_name == \"$TAG\") | .assets[].browser_download_url" releases.json)
              for URL in $DOWNLOAD_URLS; do
                FILENAME=$(basename "$URL")
                curl -sL -o "./assets/$FILENAME" "$URL" || true
              done

              if [ -z "$(ls -A ./assets)" ]; then
                gh release create "$TAG" --title "$TITLE" --notes-file notes.txt --repo ${{ github.repository }} || true
              else
                gh release create "$TAG" --title "$TITLE" --notes-file notes.txt ./assets/* --repo ${{ github.repository }} || true
              fi
              rm -rf ./assets/*; rm -f notes.txt
            fi
          done

          # 清理多余的 Release（保留最新 30 个）
          MY_TAGS=$(gh release list --repo ${{ github.repository }} --limit 100 --json tagName --jq '.[].tagName' 2>/dev/null || true)
          if [ -n "$MY_TAGS" ]; then
            COUNT=$(echo "$MY_TAGS" | grep -c . || true)
            if [ "$COUNT" -gt 30 ]; then
              TO_DELETE=$(echo "$MY_TAGS" | tail -n +31)
              for DEL_TAG in $TO_DELETE; do
                gh release delete "$DEL_TAG" --repo ${{ github.repository }} --yes --cleanup-tag || true
              done
            fi
          fi
